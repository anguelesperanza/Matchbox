# Settings for tools/console_deploy.odin: where to upload hardware test builds.
#
# The console's FTP server must be switched on by hand before an upload.
#
# A PASSWORD DOES NOT GO IN THIS FILE: it is committed. Put it in
# `console_deploy.local.ini` beside this file (gitignored, read after this one,
# so its keys win), for example:
#     vita_username = me
#     vita_password = secret
#
# One `key = value` per line. `#` or `;` at the start of a line is a comment (not
# after a value: a `#` in a password must survive). Keys are `3ds_` or `vita_`
# plus: folder_loc, protocol, encryption, hostname, port_number, username, password.
# Empty username and password mean anonymous / no login.
# Only protocol = ftp and encryption = none work so far; anything else is an error.
# folder_loc is sent to the server exactly as written (console paths, not Unix ones).

3ds_folder_loc   = sdmc:/3ds
3ds_protocol     = ftp
3ds_encryption   = none
3ds_hostname     = 10.0.0.126
3ds_port_number  = 5000
3ds_username     =
3ds_password     =

vita_folder_loc  = ux0:downloads/
vita_protocol    = ftp
vita_encryption  = none
vita_hostname    = 10.0.0.209
vita_port_number = 1337
vita_username    =
vita_password    =
